<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Skill-Gap Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8; 
            color: #333;
            margin: 0;
            padding: 40px 20px;
        }
        
        /* --- NEW DASHBOARD LAYOUT --- */
        .app-wrapper {
            display: flex;
            gap: 30px;
            max-width: 1200px; /* Constrain max width for ultra-wide screens */
            margin: 0 auto; /* Center the whole dashboard */
            align-items: flex-start; /* Crucial for the sticky sidebar to work */
        }

        .left-panel {
            flex: 1; /* Tells the left side to take up all remaining space */
            min-width: 0; /* Prevents layout breaking on small screens */
        }

        .right-panel {
            width: 380px; /* Fixed width for the chatbot */
            flex-shrink: 0; /* Prevents the chatbot from getting squished */
            position: sticky; /* Makes it "stick" to the screen */
            top: 40px; /* Stays 40px from the top when scrolling */
        }

        /* Container Styles */
        .container, .chat-container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08); 
            width: 100%;
            box-sizing: border-box;
        }

        h2 { margin-top: 0; color: #1e293b; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px;}
        label { font-weight: 600; display: block; margin-bottom: 8px; color: #475569; }
        
        textarea, input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box; 
            margin-bottom: 20px;
            font-family: inherit;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        textarea { height: 120px; resize: vertical; }
        textarea:focus, input[type="text"]:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }

        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
        }
        button:hover { background-color: #2563eb; transform: translateY(-1px); }
        button:disabled { background-color: #94a3b8; cursor: not-allowed; transform: none; }

        /* Flash Cards CSS */
        #results-area { display: none; margin-top: 30px; }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .flash-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-top: 4px solid #3b82f6; 
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .flash-card:hover { transform: translateY(-5px); box-shadow: 0 12px 20px rgba(0,0,0,0.1); }
        .flash-card h4 { margin-top: 0; color: #0f172a; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 15px; font-size: 18px; }
        .flash-card ul { padding-left: 20px; margin: 0; color: #334155; line-height: 1.6; }
        .flash-card li { margin-bottom: 10px; }
        .highlight-text { font-weight: bold; color: #2563eb; font-size: 18px; display: block; margin-bottom: 8px;}

        /* Chatbot Styles */
        #chat-history { height: 350px; /* Made the chat taller since it has its own column now */ overflow-y: auto; border: 1px solid #e2e8f0; padding: 15px; margin-bottom: 15px; background-color: #f8fafc; border-radius: 6px; font-size: 14px; }
        .user-msg { color: #3b82f6; font-weight: bold; margin-bottom: 8px; }
        .bot-msg { color: #334155; margin-bottom: 18px; line-height: 1.5; }
        
        /* Mobile Responsiveness */
        @media (max-width: 850px) {
            .app-wrapper { flex-direction: column; }
            .right-panel { width: 100%; position: static; }
        }
    </style>
</head>
<body>

<div class="app-wrapper">
    
    <div class="left-panel">
        <div class="container">
            <h2>Role Matcher</h2>
            <form id="role-form">
                <label for="skills">Enter Your Current Profile & Skills:</label>
                <textarea id="skills" placeholder="E.g. Pursuing BSc. Skills: Python, HTML, CSS, Hadoop, Hive, basic Android dev..." required></textarea>
                <button type="submit" id="submit-btn">Analyze My Skills</button>
            </form>

            <div id="results-area">
                <h3 style="text-align: center; color: #1e293b; margin-top: 30px;">Your Career Blueprint</h3>
                <div class="cards-grid">
                    
                    <div class="flash-card" style="border-top-color: #10b981;">
                        <h4>🎯 Top Matching Roles</h4>
                        <ul id="card-roles"></ul>
                    </div>

                    <div class="flash-card" style="border-top-color: #8b5cf6;">
                        <h4>📝 Resume Upgrades</h4>
                        <ul id="card-bullets"></ul>
                    </div>

                    <div class="flash-card" style="border-top-color: #f59e0b;">
                        <h4>🔗 The Missing Link</h4>
                        <div style="color: #334155;">
                            <span class="highlight-text" id="card-missing-skill"></span>
                            <span id="card-missing-reason"></span>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div class="right-panel">
        <div class="chat-container">
            <h2>Career FAQ Bot</h2>
            <div id="chat-history">
                <div class="bot-msg"><strong>AI:</strong> Hi! Do you have any quick questions about interviews, resumes, or learning new skills?</div>
            </div>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="chat-input" placeholder="Type your question...">
                <button onclick="sendMessage()" style="width: auto; white-space: nowrap;">Ask</button>
            </div>
        </div>
    </div>

</div>

<script>
    document.getElementById('role-form').addEventListener('submit', async function(e) {
        e.preventDefault(); 
        
        const skillsText = document.getElementById('skills').value;
        const btn = document.getElementById('submit-btn');
        const resultsArea = document.getElementById('results-area');
        
        btn.innerText = "Analyzing Skills...";
        btn.disabled = true;
        resultsArea.style.display = "none"; 

        try {
            const response = await fetch('/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ candidate_profile: skillsText })
            });
            const data = await response.json();
            
            const rolesList = document.getElementById('card-roles');
            rolesList.innerHTML = ''; 
            data.roles.forEach(role => { rolesList.innerHTML += `<li><strong>${role}</strong></li>`; });

            const bulletsList = document.getElementById('card-bullets');
            bulletsList.innerHTML = '';
            data.resume_bullets.forEach(bullet => { bulletsList.innerHTML += `<li>${bullet}</li>`; });

            document.getElementById('card-missing-skill').innerText = data.missing_link_skill;
            document.getElementById('card-missing-reason').innerText = data.missing_link_reason;

            resultsArea.style.display = "block";

        } catch (error) {
            alert("Oops! Something went wrong analyzing your skills.");
        } finally {
            btn.innerText = "Analyze My Skills";
            btn.disabled = false;
        }
    });

    async function sendMessage() {
        const inputField = document.getElementById('chat-input');
        const chatHistory = document.getElementById('chat-history');
        const userText = inputField.value;

        if (!userText) return;

        chatHistory.innerHTML += `<div class="user-msg">You: ${userText}</div>`;
        inputField.value = '';

        const loadingId = "loading-" + Date.now();
        chatHistory.innerHTML += `<div class="bot-msg" id="${loadingId}"><em>Thinking...</em></div>`;
        chatHistory.scrollTop = chatHistory.scrollHeight;

        try {
            const response = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: userText })
            });
            const data = await response.json();
            document.getElementById(loadingId).remove();
            chatHistory.innerHTML += `<div class="bot-msg"><strong>AI:</strong> ${data.reply}</div>`;
        } catch (error) {
            document.getElementById(loadingId).innerHTML = "<strong>AI:</strong> Sorry, there was an error.";
        }
        chatHistory.scrollTop = chatHistory.scrollHeight;
    }
</script>

</body>
</html>
